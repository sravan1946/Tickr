{% extends "base.html" %}

{% block title %}Delete {{ event.title }}{% endblock %}

{% block nav %}
    <a href="{% url 'events:event_list' %}">Events</a>
    <a href="{% url 'events:event_detail' slug=event.slug %}">{{ event.title }}</a>
{% endblock %}

{% block content %}
<div class="card">
    <h1 style="margin-top: 0;">Delete event</h1>
    <p>Are you sure you want to delete <strong>{{ event.title }}</strong>? This cannot be undone.</p>
    <form method="post" action="">
        {% csrf_token %}
        <button type="submit" class="btn" style="background: var(--error);">Delete</button>
        <a href="{% url 'events:event_detail' slug=event.slug %}" class="btn btn-ghost" style="width: auto; margin-left: 0.5rem;">Cancel</a>
    </form>
</div>
{% endblock %}
